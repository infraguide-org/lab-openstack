name: Build slides

on:
  push:
    branches: ["main"]
    paths:
      - "slides/src/**"
      - ".github/workflows/slides.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build html, pdf and pptx
        working-directory: slides/src
        run: |
          npx --yes @marp-team/marp-cli@4
          npx --yes @marp-team/marp-cli@4 --pdf
          npx --yes @marp-team/marp-cli@4 --pptx
          cp -r assets ../dist/assets

      - name: Create index.json and index.html
        working-directory: slides/dist
        run: |
          rm -f README.*
          decks=$(ls *.html | grep -v '^index.html$' | sed 's/\.html$//' | sort)
          {
            echo '{"decks":['
            sep=""
            for d in $decks; do
              printf '%s{"name":"%s","html":"%s.html","pdf":"%s.pdf","pptx":"%s.pptx"}' "$sep" "$d" "$d" "$d" "$d"
              sep=","
            done
            echo ']}'
          } > index.json
          {
            echo '<!doctype html><meta charset="utf-8"><title>Slides</title><h1>Slides</h1><ul>'
            for d in $decks; do
              echo "<li>$d: <a href=\"$d.html\">html</a> <a href=\"$d.pdf\">pdf</a> <a href=\"$d.pptx\">pptx</a></li>"
            done
            echo '</ul>'
          } > index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
