# Network Layout

# ID Allacation
#   0  -  15  - network
#  16  -  31  - infra
#  32  - 128  - openstack
# 128  - 160  - ceph


##############################################################################
resolve_conf:
  nameservers:
    - 10.14.0.10
  searchdomains:
    - lab.nfgd.net

dns_conf:
  entries:
    infra:
      hypervisor.lab.nfgd.net:                   10.14.0.8
      dns.lab.nfgd.net:                          10.14.0.10
      registry.lab.nfgd.net:                     10.14.0.17
      proxy.lab.nfgd.net:                        10.14.0.19
      deployment.lab.nfgd.net:                   10.14.0.24
      recorder.lab.nfgd.net:                     10.14.0.25
    openstack:
      dashboard.openstack.services.lab.nfgd.net: 10.34.10.35
      int.os.lab.nfgd.net:                       10.20.8.35
      keystone.os.svc.lab.nfgd.net:              10.34.10.35
      glance.os.svc.lab.nfgd.net:                10.34.10.35
      heat.os.svc.lab.nfgd.net:                  10.34.10.35
      cinder.os.svc.lab.nfgd.net:                10.34.10.35
      cinder.os.svc.lab.nfgd.net:                10.34.10.35
      nova.os.svc.lab.nfgd.net:                  10.34.10.35
      heat-cfn.os.svc.lab.nfgd.net:              10.34.10.35
      neutron.os.svc.lab.nfgd.net:               10.34.10.35
      octavia.os.svc.lab.nfgd.net:               10.34.10.35
      skyline-a.os.svc.lab.nfgd.net:             10.34.10.35
      placement.os.svc.lab.nfgd.net:             10.34.10.35
      # novncproxy.os.svc.lab.nfgd.net:            10.34.10.35
      novncproxy.os.svc.lab.nfgd.net:            10.20.8.35
    services:
      dns.services.lab.nfgd.net:                 10.34.10.10
      registry.services.lab.nfgd.net:            10.34.10.17
      proxy.services.lab.nfgd.net:               10.34.10.19
      recorder.services.lab.nfgd.net:            10.34.10.25
    storage:
      dashboard.ceph.services.lab.nfgd.net:      10.34.10.135
      s3.storage.lab.nfgd.net:                   10.34.10.135
      s3.svc.lab.nfgd.net:                       10.34.10.135
      s3.services.lab.nfgd.net:                  10.34.10.135

##############################################################################
network_conf:
  ############################################################################
  # Public -> Intranet
  ############################################################################
  public:
    iface:       pblc0
    addr:        10.30.0.0/24
  ############################################################################
  # Infra
  ############################################################################
  management:
    iface:   mgmt0
    addr:    10.14.0.0/24
    domain:  mgmt.lab.nfgd.net
  services:
    iface:   srvc0
    addr:    10.34.10.0/24
    domain:  services.lab.nfgd.net
  ############################################################################
  # openstack
  ############################################################################
  controlplane:
    iface:   cpln0
    addr:    10.20.8.0/24
    domain:  os.lab.nfgd.net
  dataplane:
    iface:   dpln0
    addr:    10.20.9.0/24
  lbmanagement:
    iface:   lmgt0
    addr:    10.20.15.0/24
  external:
    # multiple vlans can be used within this interface (trunk mode)
    iface:   xtrn0
    addr:
  ############################################################################
  # ceph
  ############################################################################
  storage0:
    iface:   strg0
    addr:    10.20.21.0/24
    domain:  strg.lab.nfgd.net
  storage1:
    iface:   strg1
    addr:    10.20.22.0/24

##############################################################################
openstack_network_conf:
  ############################################################################
  # external(vlan)
  ############################################################################
  # flat network
  # FIXME: mismatch public1 is created by init-runonce script
  public:
    iface:   pblc0
    # consulut your provider for ip range
    # addr:
  # vlan networks
  shared3010:
    addr:    10.30.10.0/24
    vlan:    3010
    # iface:   xtrn0
  shared3011:
    addr:    10.30.11.0/24
    vlan:    3011
    # iface:   xtrn0
  shared3012:
    addr:    10.30.12.0/24
    vlan:    3012
    # iface:   xtrn0
##############################################################################
server_conf:
  - hostname:    "router"
    domain:      "lab.nfgd.net"
    ram:         4096
    cpu:         1
    id:          2
    networks:    [management, public, external]
    netaddr:     auto
    disks:       []
    command:     "curl -sSL https://nfgd.net/raw/setup-sandbox/scripts/infra/router.sh | bash"
  - hostname:    "dns"
    domain:      "lab.nfgd.net"
    ram:         4096
    cpu:         1
    id:          10
    networks:    [management, services]
    netaddr:     auto
    disks:       [4]
    proxy:       yes
    command:     "curl -sSL https://nfgd.net/raw/setup-sandbox/scripts/infra/dns.sh | bash -s -- lab-openstack"
  - hostname:    "registry"
    domain:      "lab.nfgd.net"
    ram:         8192
    cpu:         2
    id:          17
    networks:    [management, services]
    netaddr:     auto
    disks:       [32]
    command:     "curl -sSL https://nfgd.net/raw/setup-sandbox/scripts/infra/registry.sh | bash"
  - hostname:    "proxy"
    domain:      "lab.nfgd.net"
    ram:         4096
    cpu:         1
    id:          19
    networks:    [management, services]
    netaddr:     auto
    disks:       [4]
    command:     "curl -sSL https://nfgd.net/raw/setup-sandbox/scripts/infra/proxy.sh | bash"
  - hostname:    "deployment"
    domain:      "lab.nfgd.net"
    ram:         8192
    cpu:         2
    id:          24
    networks:    [management, controlplane, storage0]
    netaddr:     auto
    disks:       [8]
    command:     "curl -sSL --proxy http://proxy.lab.nfgd.net:3128 https://nfgd.net/raw/lab-openstack/scripts/infra/deployment.sh | bash"
    airgapped:   soft
  - hostname:    "recorder"
    domain:      "lab.nfgd.net"
    ram:         4096
    cpu:         1
    id:          25
    networks:    [management, services]
    netaddr:     auto
    disks:       [4]
    command:     "curl -sSL --proxy http://proxy.lab.nfgd.net:3128 https://nfgd.net/raw/lab-openstack/scripts/infra/recorder.sh | bash"
    airgapped:   true
  ############################################################################
  #  openstack controller
  ############################################################################
  # TODO: dataplane is not needed on controllers
  - hostname:    "controller01"
    domain:      "os.lab.nfgd.net"
    ram:         32768
    cpu:         8
    id:          32
    networks:    [management, storage0, controlplane, dataplane, lbmanagement, services]
    netaddr:     auto
    disks:       [32]
    airgapped:   true
  - hostname:    "controller02"
    domain:      "os.lab.nfgd.net"
    ram:         32768
    cpu:         8
    id:          33
    networks:    [management, storage0, controlplane, dataplane, lbmanagement, services]
    netaddr:     auto
    disks:       [32]
    airgapped:   true
  - hostname:    "controller03"
    domain:      "os.lab.nfgd.net"
    ram:         32768
    cpu:         8
    id:          34
    networks:    [management, storage0, controlplane, dataplane, lbmanagement, services]
    netaddr:     auto
    disks:       [32]
    airgapped:   true
  # id: 35 - > HA
  ############################################################################
  #  openstack network
  ############################################################################
  - hostname:    "network01"
    domain:      "os.lab.nfgd.net"
    ram:         6144
    cpu:         2
    id:          40
    networks:    [management, controlplane, dataplane, external, lbmanagement, public]
    netaddr:
      external:
      public:
    disks:       [8]
    airgapped:   true
