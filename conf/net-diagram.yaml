# title: OpenStack Umgebung
show_addr: true
# Only the networks listed here are drawn (id = key in network_conf of env.yaml).
# side:  top | bottom   (default: bottom)
# style: normal | grey  (default: normal)
networks:
  - {id: services,     label: Services,      color: "#2f9e44", side: top}
  - {id: controlplane, label: Control Plane, color: "#e8590c", side: top}
  - {id: lbmanagement, label: LB Management, color: "#0c8599", side: top}
  - {id: dataplane,    label: Data Plane,    color: "#e03131"}
  - {id: storage0,     label: Storage,       color: "#9c36b5"}
  - {id: public,       label: Public,        color: "#1971c2"}
  - {id: external,     label: External,      color: "#5c940d"}
# host_groups: hosts = names or patterns from server_conf (order as in env.yaml)
#   scalable: true -> only the first and the last host of the group, "..." in between
host_groups:
  - {name: Controller, hosts: ["controller*"]}
  - {name: Network,    hosts: ["network*"]}
  - {name: Compute,    hosts: ["compute*"], scalable: true}
  - {name: Sonstige,   hosts: [monitor01, testing]}
