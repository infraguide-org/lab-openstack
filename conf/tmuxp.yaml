---
session_name: stack
windows:
  - window_name: openstack
    layout: tiled
    shell_command_before:
      - cd ~/
    panes:
      - ssh -t controller01.mgmt.lab.nfgd.net sudo su -
      - ssh -t controller02.mgmt.lab.nfgd.net sudo su -
      - ssh -t controller03.mgmt.lab.nfgd.net sudo su -
      - ssh -t network01.mgmt.lab.nfgd.net    sudo su -
      - ssh -t network02.mgmt.lab.nfgd.net    sudo su -
      - ssh -t network03.mgmt.lab.nfgd.net    sudo su -
      - ssh -t monitor01.mgmt.lab.nfgd.net    sudo su -
      - cd  ~/openstack/
      - ssh -t testing.mgmt.lab.nfgd.net
  - window_name: compute
    layout: tiled
    shell_command_before:
      - cd ~/
    panes:
      - ssh -t compute01.mgmt.lab.nfgd.net sudo su -
      - ssh -t compute02.mgmt.lab.nfgd.net sudo su -
      - ''
      - ssh -t compute11.mgmt.lab.nfgd.net sudo su -
      - ssh -t compute12.mgmt.lab.nfgd.net sudo su -
      - ''
      - ''
      - ''
      - ''
  - window_name: ceph
    layout: tiled
    shell_command_before:
      - cd ~/
    panes:
      - ssh -t cephmon01.strg.lab.nfgd.net sudo su -
      - ssh -t cephmon02.strg.lab.nfgd.net sudo su -
      - ssh -t cephmon03.strg.lab.nfgd.net sudo su -
      - ssh -t cephosd01.strg.lab.nfgd.net sudo su -
      - ssh -t cephosd02.strg.lab.nfgd.net sudo su -
      - ssh -t cephosd03.strg.lab.nfgd.net sudo su -
      - sudo su -
      - sudo su -
      - cd  ~/ceph
  - window_name: infra
    layout: tiled
    shell_command_before:
      - cd ~/
    panes:
      - ssh -t dns.lab.nfgd.net        sudo su -
      - ssh -t proxy.lab.nfgd.net      sudo su -
      - ssh -t recorder.lab.nfgd.net   sudo su -
      - ssh -t registry.lab.nfgd.net   sudo su -
      - ssh -t hypervisor.lab.nfgd.net
      - ''
